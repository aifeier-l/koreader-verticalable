name: Bug report
description: Report a rendering or display issue in vertical (tategumi) text
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! This fork focuses on Japanese vertical text (縦書き / tategumi).

        **Note:** Many display issues are caused by font limitations (missing OpenType `vert`/`vrt2` features)
        rather than rendering bugs. Please read each field carefully before submitting.

  - type: checkboxes
    id: preflight-checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: >-
            This issue is specific to vertical text — it does not occur with horizontal
            text in upstream KOReader.
          required: true
        - label: >-
            For display / glyph issues: I tried with a different font and the problem persists.
          required: false

  - type: input
    id: koreader-version
    attributes:
      label: KOReader-tategumi build
      description: Visible in Menu → Help → About KOReader
      placeholder: "e.g., 2026.05-tategumi-abc1234"
    validations:
      required: true

  - type: dropdown
    id: device-type
    attributes:
      label: Device / platform
      options:
        - Kindle
        - Kobo
        - Cervantes
        - Pocketbook
        - ReMarkable
        - Android
        - Linux (AppImage)
        - Linux (Deb / generic)
        - Linux (Flatpak)
        - MacOS (Intel)
        - MacOS (Apple Silicon, M1, M2, …)
        - Other (please specify in additional information)
    validations:
      required: true

  - type: input
    id: font-name
    attributes:
      label: Font name
      description: >-
        Which font are you using? Vertical text requires a font with OpenType `vert`/`vrt2`
        features for correct glyph orientation (punctuation, brackets, etc.).
      placeholder: "e.g., Noto Serif CJK JP, IPAMincho, (KOReader built-in)"
    validations:
      required: true

  - type: dropdown
    id: writing-mode-setup
    attributes:
      label: How is vertical text enabled?
      options:
        - The EPUB already contains writing-mode:vertical-rl in its CSS
        - I added a style tweak in KOReader settings
        - Not sure
    validations:
      required: true

  - type: input
    id: epub-info
    attributes:
      label: EPUB title and source
      description: >-
        Which book triggers the issue? If it is freely available (e.g., Aozora Bunko),
        please include the URL so it can be reproduced.
      placeholder: "e.g., 三四郎 — https://www.aozora.gr.jp/..."
    validations:
      required: false

  - type: textarea
    id: issue-description
    attributes:
      label: Issue description
      description: Describe what is wrong and what you expected. Screenshots are very helpful.
      placeholder: |
        Expected: 。appears upright in the column.
        Actual:   。appears rotated sideways.
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: additional-information
    attributes:
      label: Additional information
      description: Crash logs, screenshots, or any other context
      placeholder: Paste crash.log contents or drag-and-drop files here
    validations:
      required: false
