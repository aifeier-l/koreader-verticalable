name: Generate release keystore (one-time)

on:
  workflow_dispatch:

jobs:
  gen-keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install JDK (provides keytool)
        run: sudo apt-get update && sudo apt-get install -y default-jre-headless

      - name: Generate keystore with random password
        run: |
          # Generate a random password; saved alongside the keystore for you.
          PASS="$(openssl rand -base64 24)"
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias koreader \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -dname "CN=koreader, O=koreader, C=CN" >/dev/null 2>&1
          echo "KEYSTORE_PASSWORD=$PASS" > keystore_password.txt
          base64 -w0 release.keystore > keystore_base64.txt

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: |
            release.keystore
            keystore_base64.txt
            keystore_password.txt
