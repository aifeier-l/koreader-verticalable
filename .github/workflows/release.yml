name: Release builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2025.05)'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  MAKEFLAGS: "PARALLEL_JOBS=3 OUTPUT_DIR=build"
  OTA_BASE_URL: "https://github.com/m-tky/koreader-tategumi/releases/latest/download"

jobs:

  kindle:
    name: Kindle
    runs-on: ubuntu-latest
    container:
      image: koreader/kokindle:latest
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: kindle
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=kindle
      - name: Package
        run: make TARGET=kindle update
      - name: Rename for release
        run: cp koreader-kindle-*.zip koreader-kindle-latest-stable.zip || true
      - uses: actions/upload-artifact@v4
        with:
          name: kindle
          path: koreader-kindle-latest-stable.zip

  kindlehf:
    name: Kindle (HF)
    runs-on: ubuntu-latest
    container:
      image: koreader/kokindle:latest
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: kindlehf
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=kindlehf
      - name: Package
        run: make TARGET=kindlehf update
      - name: Rename for release
        run: cp koreader-kindlehf-*.zip koreader-kindlehf-latest-stable.zip || true
      - uses: actions/upload-artifact@v4
        with:
          name: kindlehf
          path: koreader-kindlehf-latest-stable.zip

  kindlepw2:
    name: Kindle (PW2/non-HF)
    runs-on: ubuntu-latest
    container:
      image: koreader/kokindle:latest
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: kindlepw2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=kindlepw2
      - name: Package
        run: make TARGET=kindlepw2 update
      - name: Rename for release
        run: cp koreader-kindlepw2-*.zip koreader-kindlepw2-latest-stable.zip || true
      - uses: actions/upload-artifact@v4
        with:
          name: kindlepw2
          path: koreader-kindlepw2-latest-stable.zip

  kobo:
    name: Kobo
    runs-on: ubuntu-latest
    container:
      image: koreader/kokobo:latest
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: kobo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=kobo
      - name: Package
        run: make TARGET=kobo update
      - name: Rename for release
        run: cp koreader-kobo-*.zip koreader-kobo-latest-stable.zip || true
      - uses: actions/upload-artifact@v4
        with:
          name: kobo
          path: koreader-kobo-latest-stable.zip

  pocketbook:
    name: PocketBook
    runs-on: ubuntu-latest
    container:
      image: koreader/kopb:latest
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: pocketbook
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=pocketbook
      - name: Package
        run: make TARGET=pocketbook update
      - name: Rename for release
        run: cp koreader-pocketbook-*.zip koreader-pocketbook-latest-stable.zip || true
      - uses: actions/upload-artifact@v4
        with:
          name: pocketbook
          path: koreader-pocketbook-latest-stable.zip

  cervantes:
    name: Cervantes
    runs-on: ubuntu-latest
    container:
      image: koreader/kocervantes:latest
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: cervantes
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=cervantes
      - name: Package
        run: make TARGET=cervantes update
      - name: Rename for release
        run: cp koreader-cervantes-*.zip koreader-cervantes-latest-stable.zip || true
      - uses: actions/upload-artifact@v4
        with:
          name: cervantes
          path: koreader-cervantes-latest-stable.zip

  remarkable:
    name: reMarkable (armhf)
    runs-on: ubuntu-latest
    container:
      image: koreader/koremarkable:latest
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: remarkable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=remarkable
      - name: Package
        run: make TARGET=remarkable update
      - name: Rename for release
        run: cp koreader-remarkable-*.zip koreader-remarkable-latest-stable.zip || true
      - uses: actions/upload-artifact@v4
        with:
          name: remarkable
          path: koreader-remarkable-latest-stable.zip

  remarkable-aarch64:
    name: reMarkable (aarch64)
    runs-on: ubuntu-latest
    container:
      image: koreader/koremarkable:latest
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: remarkable-aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=remarkable-aarch64
      - name: Package
        run: make TARGET=remarkable-aarch64 update
      - name: Rename for release
        run: cp koreader-remarkable-aarch64-*.zip koreader-remarkable-aarch64-latest-stable.zip || true
      - uses: actions/upload-artifact@v4
        with:
          name: remarkable-aarch64
          path: koreader-remarkable-aarch64-latest-stable.zip

  android-arm:
    name: Android (ARM)
    runs-on: ubuntu-latest
    container:
      image: koreader/koandroid:latest
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=android
      - name: Package
        run: make TARGET=android update
      - name: Sign APK
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -1)
          "${APKSIGNER}" sign \
            --ks /tmp/release.keystore \
            --ks-pass "pass:${{ secrets.ANDROID_STORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            koreader-android-*.apk
          rm -f /tmp/release.keystore
      - name: Rename for release
        run: cp koreader-android-*.apk koreader-android-latest-stable.apk 2>/dev/null || \
             cp koreader-android-*.zip koreader-android-latest-stable.zip 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm
          path: koreader-android-latest-stable.*

  android-arm64:
    name: Android (ARM64)
    runs-on: ubuntu-latest
    container:
      image: koreader/koandroid:latest
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=android ANDROID_ARCH=arm64
      - name: Package
        run: make TARGET=android ANDROID_ARCH=arm64 update
      - name: Sign APK
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -1)
          "${APKSIGNER}" sign \
            --ks /tmp/release.keystore \
            --ks-pass "pass:${{ secrets.ANDROID_STORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            koreader-android-*.apk
          rm -f /tmp/release.keystore
      - name: Rename for release
        run: cp koreader-android-arm64-*.apk koreader-android-arm64-latest-stable.apk || true
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          path: koreader-android-arm64-latest-stable.apk

  release:
    name: Create Release
    needs: [kindle, kindlehf, kindlepw2, kobo, pocketbook, cervantes, remarkable, remarkable-aarch64, android-arm, android-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create OTA aliases
        run: |
          # kobov5: same binary as kobo (FW 5.x uses different ota_model string)
          cp artifacts/kobo/koreader-kobo-latest-stable.zip \
             artifacts/kobo/koreader-kobov5-latest-stable.zip
          # kindle-legacy: same binary as kindle (non-touch Kindles)
          cp artifacts/kindle/koreader-kindle-latest-stable.zip \
             artifacts/kindle/koreader-kindle-legacy-latest-stable.zip

      - name: Generate zsync files
        run: |
          sudo apt-get update -qq && sudo apt-get install -y zsync
          for f in artifacts/**/*-latest-stable.zip; do
            name=$(basename "$f")
            zsyncmake -u "$OTA_BASE_URL/$name" \
              -o "${f%.zip}.zsync" \
              "$f"
          done

      - name: Create versioned copies for manual download
        run: |
          TAG=$RELEASE_TAG
          for f in artifacts/**/*-latest-stable.zip; do
            versioned="${f/latest-stable/$TAG}"
            cp "$f" "$versioned"
          done
          for f in artifacts/**/*-latest-stable.zsync; do
            versioned="${f/latest-stable/$TAG}"
            cp "$f" "$versioned"
          done
          for f in artifacts/**/*-latest-stable.apk; do
            versioned="${f/latest-stable/$TAG}"
            cp "$f" "$versioned" 2>/dev/null || true
          done

      - name: List artifacts
        run: find artifacts/ -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "koreader-tategumi ${{ env.RELEASE_TAG }}"
          body: |
            ## koreader-tategumi ${{ env.RELEASE_TAG }}

            KOReader fork with Japanese vertical text (縦書き/tategumi) rendering support.

            ### Downloads

            | Platform | File |
            |----------|------|
            | Kindle (HF / PW5以降) | `koreader-kindlehf-${{ env.RELEASE_TAG }}.zip` |
            | Kindle (PW2〜PW4, non-HF) | `koreader-kindlepw2-${{ env.RELEASE_TAG }}.zip` |
            | Kindle (legacy, non-touch) | `koreader-kindle-${{ env.RELEASE_TAG }}.zip` |
            | Kobo | `koreader-kobo-${{ env.RELEASE_TAG }}.zip` |
            | PocketBook | `koreader-pocketbook-${{ env.RELEASE_TAG }}.zip` |
            | Cervantes | `koreader-cervantes-${{ env.RELEASE_TAG }}.zip` |
            | reMarkable 1 (armhf) | `koreader-remarkable-${{ env.RELEASE_TAG }}.zip` |
            | reMarkable 2/Paper Pro (aarch64) | `koreader-remarkable-aarch64-${{ env.RELEASE_TAG }}.zip` |
            | Android (ARM64, most phones) | `koreader-android-arm64-${{ env.RELEASE_TAG }}.apk` |
            | Android (ARM 32-bit) | `koreader-android-${{ env.RELEASE_TAG }}.apk` |

            `*-latest-stable.*` files are also provided for OTA update support.

            ### Install
            See [KOReader installation guide](https://github.com/koreader/koreader/wiki/Installation).

            In-app OTA update is supported. Go to **Menu → Help → Check for updates**.
          files: artifacts/**/*
          draft: false
          prerelease: false
