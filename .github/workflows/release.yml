name: Release builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2025.05)'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  MAKEFLAGS: "PARALLEL_JOBS=3 OUTPUT_DIR=build"

jobs:

  kindle:
    name: Kindle
    runs-on: ubuntu-latest
    container:
      image: koreader/kokindle:0.4.6-22.04
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: kindle
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=kindle
      - name: Package
        run: make TARGET=kindle update
      - name: Rename for release
        run: |
          cp koreader-kindle-*.zip koreader-kindle-latest-stable.zip || true
      - name: Generate zsync
        run: |
          apt-get install -y zsync
          zsyncmake -o koreader-kindle-latest-stable.zsync koreader-kindle-latest-stable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: kindle
          path: |
            koreader-kindle-latest-stable.zip
            koreader-kindle-latest-stable.zsync

  kindlehf:
    name: Kindle (HF)
    runs-on: ubuntu-latest
    container:
      image: koreader/kokindle:0.4.6-22.04
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: kindlehf
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=kindlehf
      - name: Package
        run: make TARGET=kindlehf update
      - name: Rename for release
        run: cp koreader-kindlehf-*.zip koreader-kindlehf-latest-stable.zip || true
      - name: Generate zsync
        run: |
          apt-get install -y zsync
          zsyncmake -o koreader-kindlehf-latest-stable.zsync koreader-kindlehf-latest-stable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: kindlehf
          path: |
            koreader-kindlehf-latest-stable.zip
            koreader-kindlehf-latest-stable.zsync

  kobo:
    name: Kobo
    runs-on: ubuntu-latest
    container:
      image: koreader/kokobo:0.4.6-22.04
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: kobo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=kobo
      - name: Package
        run: make TARGET=kobo update
      - name: Rename for release
        run: cp koreader-kobo-*.zip koreader-kobo-latest-stable.zip || true
      - name: Generate zsync
        run: |
          apt-get install -y zsync
          zsyncmake -o koreader-kobo-latest-stable.zsync koreader-kobo-latest-stable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: kobo
          path: |
            koreader-kobo-latest-stable.zip
            koreader-kobo-latest-stable.zsync

  pocketbook:
    name: PocketBook
    runs-on: ubuntu-latest
    container:
      image: koreader/kopb:0.4.6-22.04
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: pocketbook
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=pocketbook
      - name: Package
        run: make TARGET=pocketbook update
      - name: Rename for release
        run: cp koreader-pocketbook-*.zip koreader-pocketbook-latest-stable.zip || true
      - name: Generate zsync
        run: |
          apt-get install -y zsync
          zsyncmake -o koreader-pocketbook-latest-stable.zsync koreader-pocketbook-latest-stable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pocketbook
          path: |
            koreader-pocketbook-latest-stable.zip
            koreader-pocketbook-latest-stable.zsync

  android-arm:
    name: Android (ARM)
    runs-on: ubuntu-latest
    container:
      image: koreader/koandroid:0.9.6-22.04
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=android
      - name: Package
        run: make TARGET=android update
      - name: Sign APK
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -1)
          "${APKSIGNER}" sign \
            --ks /tmp/release.keystore \
            --ks-pass "pass:${{ secrets.ANDROID_STORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            koreader-android-*.apk
          rm -f /tmp/release.keystore
      - name: Rename for release
        run: cp koreader-android-*.apk koreader-android-latest-stable.apk 2>/dev/null || \
             cp koreader-android-*.zip koreader-android-latest-stable.zip 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm
          path: koreader-android-latest-stable.*

  android-arm64:
    name: Android (ARM64)
    runs-on: ubuntu-latest
    container:
      image: koreader/koandroid:0.9.6-22.04
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=android ANDROID_ARCH=arm64
      - name: Package
        run: make TARGET=android ANDROID_ARCH=arm64 update
      - name: Sign APK
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -1)
          "${APKSIGNER}" sign \
            --ks /tmp/release.keystore \
            --ks-pass "pass:${{ secrets.ANDROID_STORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            koreader-android-*.apk
          rm -f /tmp/release.keystore
      - name: Rename for release
        run: cp koreader-android-arm64-*.apk koreader-android-arm64-latest-stable.apk || true
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          path: koreader-android-arm64-latest-stable.apk

  release:
    name: Create Release
    needs: [kindle, kindlehf, kobo, pocketbook, android-arm, android-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "koreader-tategumi ${{ env.RELEASE_TAG }}"
          body: |
            ## koreader-tategumi ${{ env.RELEASE_TAG }}

            KOReader fork with Japanese vertical text (縦書き/tategumi) rendering support.

            ### Downloads
            | Platform | File |
            |----------|------|
            | Kindle (legacy) | `koreader-kindle-latest-stable.zip` |
            | Kindle (HF) | `koreader-kindlehf-latest-stable.zip` |
            | Kobo | `koreader-kobo-latest-stable.zip` |
            | PocketBook | `koreader-pocketbook-latest-stable.zip` |
            | Android (ARM64, most phones) | `koreader-android-arm64-latest-stable.apk` |
            | Android (ARM 32-bit) | `koreader-android-latest-stable.apk` |

            ### Install
            See [KOReader installation guide](https://github.com/koreader/koreader/wiki/Installation).

            In-app OTA update is supported. Go to **Menu → Help → Check for updates**.
          files: artifacts/**/*
          draft: false
          prerelease: false
