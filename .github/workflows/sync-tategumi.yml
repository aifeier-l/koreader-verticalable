name: Sync from upstream f-coco/koreader-tategumi

on:
  schedule:
    - cron: '0 9 * * 5'  # Friday at 09:00 UTC (18:00 JST)
  workflow_dispatch:

concurrency:
  group: sync-tategumi
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # A PAT with the "workflow" permission is needed when upstream
          # changes files under .github/workflows/.
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Configure git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Fetch upstream f-coco/koreader-tategumi
        run: |
          git remote add upstream https://github.com/f-coco/koreader-tategumi.git
          git fetch upstream master

      - name: Merge from f-coco/koreader-tategumi
        id: merge
        run: |
          resolve_conflicts() {
            for file in $(git diff --name-only --diff-filter=U); do
              case "$file" in
                .github/workflows/*)
                  # Keep our local CI customization (Android-only release,
                  # disabled nightly, etc.) on conflict.
                  git checkout --ours -- "$file"
                  git add "$file"
                  ;;
                base|test|.gitmodules)
                  # Follow upstream's submodule chain.
                  git checkout --theirs -- "$file"
                  git add "$file"
                  ;;
              esac
            done
          }

          UPSTREAM_HEAD="$(git rev-parse upstream/master)"

          if git merge-base --is-ancestor "$UPSTREAM_HEAD" HEAD; then
            echo "Already up to date — nothing to merge."
            echo "MERGE_FAILED=false" >> $GITHUB_ENV
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "merged=true" >> "$GITHUB_OUTPUT"
            else
              echo "merged=false" >> "$GITHUB_OUTPUT"
            fi
          elif git merge upstream/master --no-edit; then
            echo "MERGE_FAILED=false" >> $GITHUB_ENV
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            resolve_conflicts
            REMAINING_CONFLICTS="$(git diff --name-only --diff-filter=U)"
            if [ -z "$REMAINING_CONFLICTS" ]; then
              git commit --no-edit
              echo "MERGE_FAILED=false" >> $GITHUB_ENV
              echo "merged=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Create a branch with the conflicted state for PR review
            git merge --abort
            BRANCH="upstream-sync-$(date +%Y%m%d)"
            git checkout -b "$BRANCH"
            git merge upstream/master --no-edit || true
            resolve_conflicts
            git add -A
            git commit -m "WIP: upstream sync $(date +%Y-%m-%d) — conflicts need resolution"
            git push origin "$BRANCH"
            echo "MERGE_FAILED=true" >> $GITHUB_ENV
            echo "SYNC_BRANCH=$BRANCH" >> $GITHUB_ENV
            echo "merged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push
        if: env.MERGE_FAILED != 'true'
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor origin/master HEAD; then
            git rebase origin/master
          fi
          git push origin master

      - name: Create PR on merge conflict
        if: env.MERGE_FAILED == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Upstream sync ${new Date().toISOString().slice(0,10)}: conflicts need resolution`,
              head: process.env.SYNC_BRANCH,
              base: 'master',
              body: `Automatic sync from f-coco/koreader-tategumi failed due to merge conflicts.\n\nThis PR contains the conflicted state — please resolve the markers and merge.\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  build-android:
    name: Build Android APK
    needs: sync
    if: needs.sync.outputs.merged == 'true'
    uses: ./.github/workflows/android-build.yml
    secrets: inherit
